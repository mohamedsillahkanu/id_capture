<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ID Capture</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
  --navy:#004080;
  --navy-dark:#002d5a;
  --gold:#ffc107;
  --ink:#1b2733;
  --line:#c9d6e4;
  --bg:#eef3f8;
  --ok:#1c7c4a;
  --bad:#b3261e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Roboto',Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.45}
header{background:var(--navy);border-bottom:4px solid var(--gold);padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#fff;margin:0;font-size:19px}
header p{margin:2px 0 0;color:#cfe0f2;font-size:12px}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.card{background:#fff;border:2px solid var(--navy);outline:1px solid var(--navy);outline-offset:3px;border-radius:2px;padding:14px;margin:0 0 22px}
.card.reject{border-color:var(--bad);outline-color:var(--bad)}
.card h2{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.6px;font-size:14px;color:var(--navy);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.card.reject h2{color:var(--bad);border-bottom-color:#e0a6a2}
.btn{display:block;width:100%;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.7px;font-size:15px;font-weight:500;border:0;border-radius:2px;padding:13px;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:active{background:var(--navy-dark)}
.btn.gold{background:var(--gold);color:#1b2733}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn+.btn{margin-top:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* camera with the card frame drawn over it */
.view{position:relative;background:#000;border-radius:2px;overflow:hidden;margin-bottom:12px;min-height:150px}
.view video{width:100%;display:block}
.frame{position:absolute;border:3px solid var(--gold);box-shadow:0 0 0 2000px rgba(0,0,0,.45);border-radius:4px;pointer-events:none}
.frame b{position:absolute;left:0;right:0;bottom:-26px;text-align:center;color:#fff;font-family:'Oswald',sans-serif;font-size:12px;font-weight:400;letter-spacing:.5px;text-transform:uppercase}
.hint{font-size:12.5px;color:#6b7a89;margin:12px 0 10px}
.shot{border:2px dashed var(--line);border-radius:2px;overflow:hidden;margin-bottom:10px;display:none}
.shot img{width:100%;display:block}

.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 7px;border-radius:2px;margin-bottom:10px}
.badge.on{background:#e6f4ec;color:var(--ok)}
.badge.off{background:#fdeceb;color:var(--bad)}
.badge.wait{background:#e8f0f8;color:var(--navy)}
.bar{height:6px;background:#dce6f0;border-radius:2px;overflow:hidden;margin-top:10px;display:none}
.bar.show{display:block}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
.row{padding:9px 0;border-bottom:1px solid #e6edf4}
.row:last-child{border-bottom:0}
.row .k{font-family:'Oswald',sans-serif;font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.7px;color:var(--navy)}
.row .v{font-size:16px;font-weight:500;word-break:break-word;margin-top:1px}
.row .v.none{color:var(--bad);font-weight:400;font-style:italic}
.warn{background:#fdeceb;border-left:4px solid var(--bad);color:var(--bad);padding:9px 10px;font-size:13px;margin:0 0 12px;display:none}
.big{font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:.6px;color:var(--bad);margin:0 0 6px}
.why{font-size:13.5px;margin:0 0 10px}
.seen{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.seen h3{font-family:'Oswald',sans-serif;font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.7px;color:#6b7a89;margin:0 0 6px}
.seen ul{margin:0;padding-left:18px}
.seen li{font-size:13px;margin-bottom:3px;word-break:break-word;color:#4a5b6b}
.status{margin-top:10px;font-size:13px;padding:9px 10px;border-radius:2px;display:none}
.status.show{display:block}
.status.work{background:#e8f0f8;color:var(--navy)}
.status.good{background:#e6f4ec;color:var(--ok)}
.status.err{background:#fdeceb;color:var(--bad)}
.spin{width:14px;height:14px;border:2px solid #b9cde2;border-top-color:var(--navy);border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
#out,#reject{display:none}
</style>
</head>
<body>

<header>
  <h1>ID Capture</h1>
  <p>ICF-SL staff cards</p>
</header>

<main>

  <div class="card" id="capture">
    <div class="view" id="view">
      <video id="video" playsinline muted></video>
      <div class="frame" id="frame"><b>Whole card inside this frame</b></div>
    </div>
    <button class="btn gold" id="shoot">Capture and read</button>
    <p class="hint">Fit the whole card inside the gold frame, edge to edge, and hold the phone square to it. Only what is inside the frame is read.</p>
    <div id="engine" class="badge wait">Checking the reader</div>
    <div class="shot" id="shot"><img id="shotImg" alt="The strip that was read"></div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="status" id="st"></div>
  </div>

  <div class="card" id="out">
    <h2>Card details</h2>
    <div class="warn" id="warn"></div>
    <div id="rows"></div>
    <button class="btn primary" id="again" style="margin-top:14px">Retake the photo</button>
  </div>

  <div class="card reject" id="reject">
    <h2>Card not accepted</h2>
    <p class="big">Wrong ID</p>
    <p class="why" id="why"></p>
    <div class="seen">
      <h3>Text the reader picked up</h3>
      <ul id="seenList"></ul>
    </div>
    <button class="btn primary" id="again2" style="margin-top:14px">Retake the photo</button>
  </div>

</main>

<script>
/* ------------------------------------------------------------------
   WHAT THIS APP KEEPS

   Six labelled lines and nothing else. Each value sits behind its own
   label and a colon on the card, so nothing is inferred from size or
   position, and a line with no wanted label is thrown away.

   The photograph is never turned into text. The frame crop is trimmed
   down to the text column before the reader is called, so the portrait
   and the blue band are physically not in the image it reads. The two
   numbers below are where that trim starts and they match the card
   template, so change them together if the card layout changes.
-------------------------------------------------------------------*/
var WANTED      = ['Name', 'Position', 'Dept', 'Tel', 'Address', 'Valid'];
var MIN_LABELS  = 3;      // fewer than this and the card is refused outright
var MIN_CONF    = 62;     // reader confidence below this asks for a retake
var CARD_RATIO  = 1.6;    // card width divided by height, 1200 by 750
var CROP_TOP    = 0.22;   // everything above this is cut off, the blue band
var CROP_LEFT   = 0.30;   // everything left of this is cut off, the portrait

var worker = null, stream = null, lastURL = null;

var view = document.getElementById('view');
var video = document.getElementById('video');
var frameEl = document.getElementById('frame');
var shot = document.getElementById('shot');
var shotImg = document.getElementById('shotImg');
var st = document.getElementById('st');
var out = document.getElementById('out');
var warn = document.getElementById('warn');
var rows = document.getElementById('rows');
var reject = document.getElementById('reject');
var why = document.getElementById('why');
var seenList = document.getElementById('seenList');
var shootBtn = document.getElementById('shoot');
var engine = document.getElementById('engine');
var bar = document.getElementById('bar');
var barFill = document.getElementById('barFill');

var HAS_OCR = typeof Tesseract !== 'undefined';
engine.className = 'badge ' + (HAS_OCR ? 'on' : 'off');
engine.textContent = HAS_OCR ? 'Reader loaded, runs in the browser'
                             : 'Reader did not load, check the connection and reload';

function say(kind, html){
  st.className = 'status show ' + kind;
  st.innerHTML = (kind === 'work' ? '<span class="spin"></span>' : '') + html;
}
function clear(){ st.className = 'status'; st.innerHTML = ''; }
function progress(p){
  if(p === null){ bar.className = 'bar'; barFill.style.width = '0'; return; }
  bar.className = 'bar show';
  barFill.style.width = Math.round(p * 100) + '%';
}
function hidePanels(){ out.style.display = 'none'; reject.style.display = 'none'; }

/* ---- the frame, in fractions of the picture, used for both the
        overlay you see and the crop that is actually read ---- */
function frameBox(w, h){
  var fw = w * 0.94, fh = fw / CARD_RATIO;
  if(fh > h * 0.88){ fh = h * 0.88; fw = fh * CARD_RATIO; }
  return { x: (w - fw) / 2 / w, y: (h - fh) / 2 / h, w: fw / w, h: fh / h };
}
function drawFrame(){
  var w = video.videoWidth, h = video.videoHeight;
  if(!w || !h) return;
  var b = frameBox(w, h);
  frameEl.style.left = (b.x * 100) + '%';
  frameEl.style.top = (b.y * 100) + '%';
  frameEl.style.width = (b.w * 100) + '%';
  frameEl.style.height = (b.h * 100) + '%';
}
video.addEventListener('loadedmetadata', drawFrame);
window.addEventListener('resize', drawFrame);

function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    noCamera('This browser will not give the page a camera.');
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  }).then(function(s){
    stream = s;
    video.srcObject = s;
    return video.play();
  }).then(drawFrame)
    .catch(function(e){ noCamera('The camera could not start. ' + (e && e.message ? e.message : e)); });
}
function noCamera(msg){
  view.style.display = 'none';
  shootBtn.style.display = 'none';
  say('err', msg + ' Allow the camera for this site in the browser settings, then reload. The card can only be read live through the frame.');
}
startCamera();

shootBtn.onclick = function(){
  if(!video.videoWidth){ say('err','The camera is not ready yet.'); return; }
  var w = video.videoWidth, h = video.videoHeight, b = frameBox(w, h);
  var c = document.createElement('canvas');
  var outW = 1800, outH = Math.round(outW / CARD_RATIO);
  c.width = outW; c.height = outH;
  c.getContext('2d').drawImage(video, b.x * w, b.y * h, b.w * w, b.h * h, 0, 0, outW, outH);
  readCanvas(c);
};

/* keep only the text column: the photograph and the band are cut away
   before the reader sees anything, then the crop is enlarged, greyed
   and its contrast stretched */
function textOnly(src){
  var w = src.width, h = src.height;
  var sx = Math.round(w * CROP_LEFT), sy = Math.round(h * CROP_TOP);
  var sw = w - sx, sh = h - sy;
  var scale = 1.4;

  var c = document.createElement('canvas');
  c.width = Math.round(sw * scale);
  c.height = Math.round(sh * scale);
  var ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);

  try{
    var d = ctx.getImageData(0, 0, c.width, c.height), px = d.data, lo = 255, hi = 0, i, g;
    for(i = 0; i < px.length; i += 4){
      g = (px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114) | 0;
      px[i] = px[i+1] = px[i+2] = g;
      if(g < lo) lo = g;
      if(g > hi) hi = g;
    }
    var span = Math.max(1, hi - lo), v;
    for(i = 0; i < px.length; i += 4){
      v = (px[i] - lo) * 255 / span;
      px[i] = px[i+1] = px[i+2] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
    ctx.putImageData(d, 0, 0);
  }catch(e){ }

  return c;
}

function readCanvas(c){
  if(!HAS_OCR){ say('err','The reader did not load. Reload the page once you have a connection.'); return; }
  var zone = textOnly(c);
  lastURL = zone.toDataURL('image/jpeg', 0.92);
  shotImg.src = lastURL;
  shot.style.display = 'block';
  hidePanels();
  shootBtn.disabled = true;
  say('work','Reading the card...');
  progress(0);

  ready()
    .then(function(w){ return w.recognize(lastURL); })
    .then(function(res){
      progress(null);
      shootBtn.disabled = false;
      var data = (res && res.data) || {};
      var conf = typeof data.confidence === 'number' ? data.confidence : 100;
      var lines = String(data.text || '')
                    .split('\n')
                    .map(function(t){ return t.replace(/\s+/g, ' ').trim(); })
                    .filter(function(t){ return t.length > 1; });
      if(!lines.length){
        say('err','No text was found inside the frame. Fill the frame with the card and try again.');
        return;
      }
      verdict(lines, conf);
    })
    .catch(function(e){
      progress(null);
      shootBtn.disabled = false;
      say('err','Could not read the card. ' + (e && e.message ? e.message : e));
    });
}

function ready(){
  if(worker) return Promise.resolve(worker);
  say('work','Loading the reader for the first time, this takes a moment...');
  return Tesseract.createWorker('eng', 1, {
    logger: function(m){ if(m && typeof m.progress === 'number') progress(m.progress); }
  }).then(function(w){ worker = w; return w; });
}

/* ---- loose label matching, one wrong character forgiven ---- */
function norm(s){ return String(s).toLowerCase().replace(/[^a-z]/g, ''); }

function near(a, b){
  a = norm(a); b = norm(b);
  if(!a || !b) return false;
  if(a === b) return true;
  if(a.length > 3 && b.length > 3 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) return true;
  if(Math.abs(a.length - b.length) > 1) return false;
  var i, j, prev = [], cur = [];
  for(j = 0; j <= b.length; j++) prev[j] = j;
  for(i = 1; i <= a.length; i++){
    cur[0] = i;
    for(j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur.slice();
  }
  return prev[b.length] <= 1;
}

function splitLabel(line){
  var at = line.indexOf(':');
  if(at < 1) return null;
  var label = line.slice(0, at).trim();
  if(label.length > 24 || !/[A-Za-z]/.test(label) || /[@\/]/.test(label)) return null;
  return { label: label, value: line.slice(at + 1).trim() };
}

/* ---- scrape the scraps off the end of a value ----
   Stray marks from the card edge or the lamination land as one or two
   loose characters after the real text, so they are cut off, and the
   two fields with a known shape are matched on that shape.        */
function tidy(key, v){
  v = v.replace(/[|_~`\^\[\]{}<>]+/g, ' ').replace(/\s+/g, ' ').trim();

  var t = v.split(' ');
  while(t.length > 2){
    var last = t[t.length - 1];
    if(/^[^A-Za-z0-9]+$/.test(last) || last.length <= 2 && !/^\d{4}$/.test(last)) t.pop();
    else break;
  }
  v = t.join(' ').replace(/[\s,.;:-]+$/, '').trim();

  if(key === 'Tel'){
    var m = v.match(/\+?\s?\d[\d\s().-]{6,}/);
    if(m) v = m[0].trim();
    v = v.replace(/(\d{3,4})\s+\d{1,2}$/, '$1');       // a loose digit after a full number
    v = v.replace(/[\s.-]+$/, '');
  }

  if(key === 'Valid'){
    var m2 = v.match(/[A-Za-z]{3,}\s*\d{4}\s*(?:-|–|—|to)\s*[A-Za-z]{3,}\s*\d{4}/);
    if(m2) v = m2[0].replace(/\s*(-|–|—)\s*/, '-').trim();
  }

  if(key === 'Name' || key === 'Position' || key === 'Dept'){
    v = v.replace(/[^A-Za-z)'.\-]+$/, '').trim();
  }

  return v;
}

/* ---- keep the six, then accept, warn, or refuse ---- */
function verdict(lines, conf){
  var found = {}, hits = 0, i;

  for(i = 0; i < lines.length; i++){
    var parts = splitLabel(lines[i]);
    if(!parts) continue;

    var wanted = null;
    WANTED.forEach(function(w){ if(near(parts.label, w)) wanted = w; });
    if(!wanted || found[wanted]) continue;      // Email, ID and anything else are dropped

    // No borrowing from the next line. A label whose own value was cut
    // off stays empty rather than stealing the line below it, which is
    // how a Name once ended up holding the position.
    var value = tidy(wanted, parts.value);
    if(!value) continue;

    found[wanted] = value;
    hits++;
  }

  if(hits < MIN_LABELS){ show_reject(lines, found, hits); return; }
  show_fields(found, conf);
}

function show_fields(found, conf){
  rows.innerHTML = '';
  var missing = [];
  WANTED.forEach(function(key){
    var row = document.createElement('div'); row.className = 'row';
    var k = document.createElement('div'); k.className = 'k'; k.textContent = key;
    var v = document.createElement('div');
    if(found[key]){ v.className = 'v'; v.textContent = found[key]; }
    else { v.className = 'v none'; v.textContent = 'not read'; missing.push(key); }
    row.appendChild(k); row.appendChild(v);
    rows.appendChild(row);
  });

  var blurry = conf < MIN_CONF;
  if(missing.length || blurry){
    warn.style.display = 'block';
    warn.textContent = 'Retake the photo. ' +
      (missing.length ? 'Not captured: ' + missing.join(', ') + '. ' : 'The photo is not clear enough to trust. ') +
      'Hold the camera steady and square to the card, fill the gold frame edge to edge, and keep the light off the surface.';
  } else {
    warn.style.display = 'none';
  }

  reject.style.display = 'none';
  out.style.display = 'block';
  say(missing.length || blurry ? 'err' : 'good',
      missing.length || blurry ? 'Please hold the camera well and take it again.'
                              : 'All six fields read, reader confidence ' + Math.round(conf) + ' percent.');
  out.scrollIntoView({behavior:'smooth', block:'start'});
}

function show_reject(lines, found, hits){
  var missing = WANTED.filter(function(w){ return !found[w]; });
  why.textContent = hits === 0
    ? 'Not one of the six labelled fields was found, so this is not an ICF-SL staff card. If it is, hold the camera well and take it again with the whole card inside the frame.'
    : 'Only ' + hits + ' of the six fields were found. Not captured: ' + missing.join(', ') +
      '. Retake it: hold the camera steady and square to the card, with the whole card inside the frame. Nothing was kept.';
  seenList.innerHTML = '';
  lines.slice(0, 12).forEach(function(t){
    var li = document.createElement('li'); li.textContent = t; seenList.appendChild(li);
  });
  out.style.display = 'none';
  reject.style.display = 'block';
  clear();
  reject.scrollIntoView({behavior:'smooth', block:'start'});
}

function resetAll(){
  rows.innerHTML = ''; seenList.innerHTML = '';
  warn.style.display = 'none';
  hidePanels();
  shot.style.display = 'none';
  shotImg.removeAttribute('src');
  clear(); progress(null);
  shootBtn.disabled = false;
  if(!stream) startCamera();
  window.scrollTo({top:0, behavior:'smooth'});
}
document.getElementById('again').onclick = resetAll;
document.getElementById('again2').onclick = resetAll;
</script>
</body>
</html>
